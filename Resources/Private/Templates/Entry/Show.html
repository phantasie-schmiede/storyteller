<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSB/PsbViewHelpers/ViewHelpers">
<div class="row">
    <div class="col-3">
        <h3 class="h4 align-center">
            <psb:translate id="chapter" />
        </h3>
        <ul>
            <f:for
                as="chapter"
                each="{chapters}">
                <li>
                    <f:if condition="{currentChapter} == {chapter}">
                        <f:then>
                            <f:format.crop maxCharacters="22">{chapter.title}</f:format.crop>
                        </f:then>
                        <f:else>
                            <f:link.action
                                action="show"
                                arguments="{chapter: chapter}">
                                <f:format.crop maxCharacters="22">{chapter.title}</f:format.crop>
                            </f:link.action>
                        </f:else>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </div>
    <div class="col-9">
        <div class="singleChapter">
            <h2>{currentChapter.title}</h2>
            <psbvh:content.render contentElements="{currentChapter.contentElements}" />
        </div>
        <div class="chapter-nav align-center">
            <f:if condition="{currentChapter} == {firstChapter}">
                <f:then>
                    <psb:translate id="oldestChapter" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{chapter: firstChapter}">
                        <psb:translate id="oldestChapter" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentChapter} == {previousChapter}">
                <f:then>
                    <psb:translate id="previousChapter" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{chapter: previousChapter}">
                        <psb:translate id="previousChapter" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentChapter} == {nextChapter}">
                <f:then>
                    <psb:translate id="nextChapter" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{chapter: nextChapter}">
                        <psb:translate id="nextChapter" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentChapter} == {lastChapter}">
                <f:then>
                    <psb:translate id="latestChapter" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{chapter: lastChapter}">
                        <psb:translate id="latestChapter" />
                    </f:link.action>
                </f:else>
            </f:if>
        </div>
    </div>
</div>
</html>
