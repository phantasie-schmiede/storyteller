<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSB/PsbViewHelpers/ViewHelpers">
<div class="row">
    <div class="col-3">
        <h3 class="h4 align-center">
            <psb:translate id="chapter" />
        </h3>
        <ul>
            <f:for
                as="entry"
                each="{entries}">
                <li>
                    <f:if condition="{currentEntry} == {entry}">
                        <f:then>
                            <f:format.crop maxCharacters="22">{entry.title}</f:format.crop>
                        </f:then>
                        <f:else>
                            <f:link.action
                                action="show"
                                arguments="{entry: entry}">
                                <f:format.crop maxCharacters="22">{entry.title}</f:format.crop>
                            </f:link.action>
                        </f:else>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </div>
    <div class="col-9">
        <div class="singleEntry">
            <h2>{currentEntry.title}</h2>
            <psbvh:content.render contentElements="{currentEntry.contentElements}" />
        </div>
        <div class="entry-nav align-center">
            <f:if condition="{currentEntry} == {firstEntry}">
                <f:then>
                    <psb:translate id="oldestEntry" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{entry: firstEntry}">
                        <psb:translate id="oldestEntry" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentEntry} == {previousEntry}">
                <f:then>
                    <psb:translate id="previousEntry" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{entry: previousEntry}">
                        <psb:translate id="previousEntry" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentEntry} == {nextEntry}">
                <f:then>
                    <psb:translate id="nextEntry" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{entry: nextEntry}">
                        <psb:translate id="nextEntry" />
                    </f:link.action>
                </f:else>
            </f:if>
            |
            <f:if condition="{currentEntry} == {lastEntry}">
                <f:then>
                    <psb:translate id="latestEntry" />
                </f:then>
                <f:else>
                    <f:link.action
                        action="show"
                        arguments="{entry: lastEntry}">
                        <psb:translate id="latestEntry" />
                    </f:link.action>
                </f:else>
            </f:if>
        </div>
    </div>
</div>
</html>
